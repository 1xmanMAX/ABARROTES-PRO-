[package]
name = "mi-bodega"
version = "0.1.0"
edition = "2021"
description = "Mi Bodega en la PC: abre la app y sincroniza por Wi-Fi con el celular (adaptado de Canvas de Citas)"
publish = false

[workspace]
# movil/: la misma copia principal y Nexo, compilados para Android (cdylib).
members = [".", "movil"]

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22"
getrandom = "0.2"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Nexo (THE-WORLD-NEX): sincronización entre aparatos por la red local, sin servidor.
nexo = { git = "https://github.com/1xmanMAX/THE-WORLD-NEX", rev = "95caa907b8c68bff32cfc1aaf5326d114907e5d9" }

[dev-dependencies]
tempfile = "3"
# examples/nodo_prueba.rs (descubrimiento por carpeta para las pruebas de la app)
nexo-red = { git = "https://github.com/1xmanMAX/THE-WORLD-NEX", rev = "95caa907b8c68bff32cfc1aaf5326d114907e5d9" }
tokio = { version = "1", features = ["sync"] }

[profile.release]
strip = true
