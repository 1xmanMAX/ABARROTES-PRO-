<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>V2 — Entregar a vendedor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;background:#F3ECDA;color:#21291F;font-family:'Archivo',system-ui,sans-serif">

<header style="background:#2B4636;color:#F3ECDA;padding:10px 14px;border-bottom:3px solid {{accent}};display:flex;align-items:center;gap:10px;flex-shrink:0">
  <button type="button" aria-label="Volver" style="width:44px;height:44px;border:none;border-radius:8px;background:rgba(255,255,255,0.08);color:#F3ECDA;display:flex;align-items:center;justify-content:center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div style="flex:1">
    <div style="font-weight:700;font-size:17px">Entregar a vendedor</div>
    <div style="font-size:12px;color:#C7B98F">Mercadería a consignación</div>
  </div>
</header>

<main style="flex:1 1 auto;display:flex;flex-direction:column;gap:12px;padding:14px;box-sizing:border-box;overflow:hidden">

  <div style="background:#FFFDF6;border:1px solid #E1D4AC;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px">
    <span style="width:40px;height:40px;border-radius:50%;background:#2B4636;color:{{accent}};display:flex;align-items:center;justify-content:center;font-weight:800">JQ</span>
    <span style="flex:1"><span style="display:block;font-weight:700;font-size:15px">Juan Quispe</span><span style="display:block;font-size:11px;color:#5C6552">Pendiente anterior: S/ 152.00</span></span>
    <button type="button" style="height:44px;padding:0 10px;border:1.5px solid #2B4636;border-radius:8px;background:transparent;color:#2B4636;font-weight:700;font-size:12px;font-family:'Archivo',sans-serif">Cambiar</button>
  </div>

  <div style="background:#FFFDF6;border:1px solid #E1D4AC;border-radius:10px;padding:10px 12px">
    <div style="display:grid;grid-template-columns:1fr 56px 70px 76px;gap:6px;font-size:10px;font-weight:700;color:#5C6552;padding-bottom:6px;border-bottom:1px solid #E1D4AC">
      <span>PRODUCTO</span><span style="text-align:center">CANT.</span><span style="text-align:right">PRECIO</span><span style="text-align:right">SUBTOTAL</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 56px 70px 76px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px dashed #E1D4AC;font-size:13px">
      <span style="font-weight:600">Arroz saco</span><span style="text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700">10</span><span style="text-align:right;font-family:'IBM Plex Mono',monospace">180.00</span><span style="text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:700">1,800.00</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 56px 70px 76px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px dashed #E1D4AC;font-size:13px">
      <span style="font-weight:600">Aceite caja</span><span style="text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700">5</span><span style="text-align:right;font-family:'IBM Plex Mono',monospace">105.00</span><span style="text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:700">525.00</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 56px 70px 76px;gap:6px;align-items:center;padding:9px 0;font-size:13px">
      <span style="font-weight:600">Avena bolsa</span><span style="text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700">8</span><span style="text-align:right;font-family:'IBM Plex Mono',monospace">56.00</span><span style="text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:700">448.00</span>
    </div>
    <button type="button" style="width:100%;height:44px;margin-top:6px;border:1.5px dashed #B9AC84;border-radius:8px;background:transparent;color:#5C6552;font-weight:700;font-size:13px;font-family:'Archivo',sans-serif">+ Agregar producto</button>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px;background:#FFFDF6;border:1px solid #E1D4AC;border-radius:10px;padding:10px 12px">
    <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:#5C6552">Valor entregado</span><span style="font-family:'IBM Plex Mono',monospace;font-weight:700">S/ 2,773.00</span></div>
    <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:#5C6552">Fecha para liquidar</span><span style="font-weight:700">sábado 26 sep</span></div>
  </div>

  <div style="margin-top:auto;background:#2B4636;border-radius:12px;padding:14px;color:#F3ECDA;display:flex;flex-direction:column;gap:10px;align-items:center">
    <div style="font-size:13px;font-weight:700;text-align:center">Juan firma que recibió la mercadería</div>
    <div style="display:flex;gap:14px">
      <span style="width:16px;height:16px;border-radius:50%;border:2px solid {{accent}};box-sizing:border-box"></span>
      <span style="width:16px;height:16px;border-radius:50%;border:2px solid {{accent}};box-sizing:border-box"></span>
      <span style="width:16px;height:16px;border-radius:50%;border:2px solid {{accent}};box-sizing:border-box"></span>
      <span style="width:16px;height:16px;border-radius:50%;border:2px solid {{accent}};box-sizing:border-box"></span>
    </div>
    <button type="button" style="width:100%;height:56px;border:none;border-radius:10px;background:{{accent}};color:#1D3226;font-weight:800;font-size:16px;font-family:'Archivo',sans-serif">Entregar y pedir código</button>
  </div>

</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C89A3E","options":["#C89A3E","#4C7A5D","#2B4636","#A24632"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C89A3E' };
  }
}
</script>
</body>
</html>
