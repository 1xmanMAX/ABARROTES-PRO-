<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;background:#F3ECDA;color:#21291F;font-family:'Archivo',system-ui,sans-serif">

    </button>
    <button type="button" style="display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:8px 12px;border:1.5px solid #E1D4AC;border-radius:10px;background:#FFFDF6;color:#21291F;font-family:'Archivo',sans-serif;text-align:left">

    <button type="button" style="height:44px;border:1.5px dashed #B9AC84;border-radius:10px;background:transparent;color:#5C6552;font-weight:700;font-size:13px;font-family:'Archivo',sans-serif">+ Nuevo cliente (crea su código)</button>
  </div>

  <div style="background:#FFFDF6;border:1px solid #E1D4AC;border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between">
    <span style="font-size:13px;color:#5C6552">Nuevo saldo de Rosa</span>
    <span style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;color:#A24632">S/ 718.00</span>
  </div>

  <div style="background:#2B4636;border-radius:12px;padding:12px;color:#F3ECDA;display:flex;flex-direction:column;gap:10px">

    </div>
    <div style="display:flex;justify-content:center;gap:14px">

      <span style="width:16px;height:16px;border-radius:50%;border:2px solid {{accent}};box-sizing:border-box"></span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">

      <button type="button" style="height:46px;border:none;border-radius:8px;background:rgba(255,255,255,0.1);color:#F3ECDA;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px">3</button>
      <button type="button" style="height:46px;border:none;border-radius:8px;background:rgba(255,255,255,0.1);color:#F3ECDA;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px">4</button>
      <button type="button" style="height:46px;border:none;border-radius:8px;background:rgba(255,255,255,0.1);color:#F3ECDA;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px">5</button>
      <button type="button" style="height:46px;border:none;border-radius:8px;background:rgba(255,255,255,0.1);color:#F3ECDA;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px">6</button>
      <button type="button" style="height:46px;border:none;border-radius:8px;background:rgba(255,255,255,0.1);color:#F3ECDA;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px">7</button>
      <button type="button" style="height:46px;border:none;border-radius:8px;background:rgba(255,255,255,0.1);color:#F3ECDA;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px">8</button>
      <button type="button" style="height:46px;border:none;border-radius:8px;background:rgba(255,255,255,0.1);color:#F3ECDA;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px">9</button>
      <button type="button" aria-label="Borrar" style="height:46px;border:none;border-radius:8px;background:transparent;color:#E4C9BC;font-weight:700;font-size:14px;font-family:'Archivo',sans-serif">Borrar</button>
      <button type="button" style="height:46px;border:none;border-radius:8px;background:rgba(255,255,255,0.1);color:#F3ECDA;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px">0</button>
      <a href="V2-Comprobante.dc.html" style="height:46px;border-radius:8px;background:{{accent}};color:#1D3226;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center">Firmar</a>
    </div>
  </div>

</main>

</div>
</x-dc>
