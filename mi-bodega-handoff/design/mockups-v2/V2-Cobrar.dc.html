<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>V2 — Cobrar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;background:#F3ECDA;color:#21291F;font-family:'Archivo',system-ui,sans-serif">

<header style="background:#2B4636;color:#F3ECDA;padding:10px 14px;border-bottom:3px solid {{accent}};display:flex;align-items:center;gap:10px;flex-shrink:0">
  <a href="V2-Vender.dc.html" aria-label="Volver" style="width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,0.08);color:#F3ECDA;display:flex;align-items:center;justify-content:center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div style="font-weight:700;font-size:17px">Cobrar · Cliente 1</div>
</header>

<main style="flex:1 1 auto;display:flex;flex-direction:column;gap:14px;padding:16px 14px;box-sizing:border-box;overflow:hidden">

  <div style="text-align:center;padding:6px 0">
    <div style="font-size:13px;color:#5C6552">Total a cobrar</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:42px">S/ 478.00</div>
    <div style="font-size:12px;color:#5C6552">Arroz saco ×2 · Aceite caja ×1</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:#FFFDF6;border:1px solid #E1D4AC;border-radius:12px;padding:5px">
    <button type="button" style="height:48px;border:none;border-radius:9px;background:#2B4636;color:#F3ECDA;font-weight:700;font-size:14px;font-family:'Archivo',sans-serif">Efectivo</button>
    <button type="button" style="height:48px;border:none;border-radius:9px;background:transparent;color:#21291F;font-weight:700;font-size:14px;font-family:'Archivo',sans-serif">Yape / Plin</button>
    <a href="V2-Fiado.dc.html" style="height:48px;border-radius:9px;background:transparent;color:#A24632;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center">Fiado</a>
  </div>

  <div>
    <div style="font-size:11px;font-weight:700;color:#5C6552;letter-spacing:0.04em;margin-bottom:6px">EL CLIENTE ENTREGA</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <button type="button" style="height:56px;border:1.5px solid #E1D4AC;border-radius:10px;background:#FFFDF6;color:#21291F;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px">Exacto</button>
      <button type="button" style="height:56px;border:3px solid {{accent}};border-radius:10px;background:#FFFDF6;color:#21291F;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px">S/ 500</button>
      <button type="button" style="height:56px;border:1.5px solid #E1D4AC;border-radius:10px;background:#FFFDF6;color:#21291F;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px">S/ 480</button>
      <button type="button" style="height:56px;border:1.5px solid #E1D4AC;border-radius:10px;background:#FFFDF6;color:#21291F;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px">Otro monto</button>
    </div>
  </div>

  <div style="background:#FFFDF6;border:1px solid #E1D4AC;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:15px;font-weight:700">Vuelto</span>
    <span style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:30px;color:#4C7A5D">S/ 22.00</span>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
    <button type="button" style="height:60px;border:none;border-radius:12px;background:{{accent}};color:#1D3226;font-weight:800;font-size:18px;font-family:'Archivo',sans-serif">Cobrar e imprimir</button>
    <button type="button" style="height:48px;border:1.5px solid #2B4636;border-radius:12px;background:transparent;color:#2B4636;font-weight:700;font-size:15px;font-family:'Archivo',sans-serif">Cobrar sin ticket</button>
  </div>

</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C89A3E","options":["#C89A3E","#4C7A5D","#2B4636","#A24632"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#C89A3E' };
  }
}
</script>
</body>
</html>
